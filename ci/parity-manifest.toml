# Cross-surface dependency-graph parity manifest (SC-TASK-006 AC-4).
#
# Two declared policies over the crypto-roots closure of each build surface,
# enforced by `scripts/parity-check.py` (see `make parity-check`):
#   - [crypto_components]  — security-critical crypto; identity parity is the
#                            EPR-0001 §4 SECURITY gate (divergence => exit 2).
#   - [non_crypto_shared]  — shared utilities reachable from the crypto roots;
#                            kept in lockstep by repo policy but reported SEPARATELY
#                            (drift => exit 4), so a utility bump never reads as a
#                            security alarm and EPR-0001 §4 "security-critical" stays
#                            legible for adopters.
# Nodes neither declared nor under a declared out-of-scope root REFUSE (exit 3).
#
# Reviewed like a lockfile (secrev owns the crypto/util boundary). Identity is the
# full (name, version, source, checksum) tuple. Regenerate the generated tables
# with `make parity-manifest-regen` after any dependency change and review the diff.

anchor = "root"

# Surfaces whose graph equals root by enforcement (AC-2 --locked release build),
# so they carry no separate lock here. Declared so coverage is explicit.
inherits_root = ["cli", "go-ffi"]

[surfaces]
root = "Cargo.lock"
ts-native = "bindings/typescript/native/Cargo.lock"

# Crypto roots -> surfaces expected to link them. The in-scope set is DERIVED as the
# identity closure of these roots per surface. `ed25519-dalek` (signing) is root-only:
# the TS napi addon links seclusor-crypto with default features (signing off). When
# D11B enables TS signing and ed25519-dalek enters the ts-native graph, the per-root
# surface-entry check REFUSES until this scope is updated + reviewed.
[roots]
age = ["root", "ts-native"]
ed25519-dalek = ["root"]

# Declared out-of-scope subtree roots (fail-closed exemptions), each rationaled.
# Non-crypto; they legitimately resolve differently between the full workspace lock
# and the single-addon lock. The crypto RNG path (rand_core -> getrandom 0.2.17)
# stays in scope; only the util getrandom 0.4.3 (via tempfile) is exempted.
[out_of_scope_roots]
i18n-embed = "localization runtime (fluent/langid); no crypto property; differs full-workspace vs single-addon"
i18n-embed-fl = "localization proc-macro (fluent-syntax/intl/unic-langid + proc-macro-error2 per SDR-0003); compile-time, no crypto property"
rust-embed = "compile-time asset embedding; pulls walkdir/winapi-util/windows-sys platform shim; no crypto property"
tempfile = "temp-file utility; its getrandom 0.4.3 is unrelated to the crypto RNG (rand_core -> getrandom 0.2.17)"

