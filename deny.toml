# cargo-deny configuration (bootstrap)
#
# Goal: keep a permissive license posture (MIT/Apache-2.0/BSD/ISC/etc) and
# fail fast if GPL-family deps appear.

[graph]
all-features = true

[advisories]
db-path = "target/advisory-dbs"
db-urls = ["https://github.com/RustSec/advisory-db"]
# Accepted build-time-only proc-macro unmaintained residuals via age -> i18n-embed*:
# - RUSTSEC-2026-0173 (proc-macro-error2): docs/decisions/SDR-0003-rustsec-2026-0173-advisory-acceptance.md
# - RUSTSEC-2026-0374 (basic-toml): docs/decisions/SDR-0004-rustsec-2026-0374-advisory-acceptance.md
# Revisit at v0.3.0 (age 0.12) or by 2027-02-13. CI runs matching ID-pinned
# `cargo audit --deny warnings --ignore ...` on both locks alongside `cargo deny check advisories`.
ignore = [
  { id = "RUSTSEC-2026-0173", reason = "accepted per SDR-0003: unmaintained compile-time-only transitive (age → i18n-embed-fl); no safe upgrade in age 0.11; revisit by v0.3.0 or 2027-02-13" },
  { id = "RUSTSEC-2026-0374", reason = "accepted per SDR-0004: unmaintained compile-time-only transitive (age → i18n-embed* → i18n-config → basic-toml); no safe upgrade in age 0.11; revisit by v0.3.0 or 2027-02-13" },
]

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
