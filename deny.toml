# cargo-deny configuration (bootstrap)
#
# Goal: keep a permissive license posture (MIT/Apache-2.0/BSD/ISC/etc) and
# fail fast if GPL-family deps appear.

[graph]
all-features = true

[advisories]
db-path = "target/advisory-dbs"
db-urls = ["https://github.com/RustSec/advisory-db"]
# RUSTSEC-2026-0173 (proc-macro-error2 unmaintained). Decision of record:
# docs/decisions/SDR-0003-rustsec-2026-0173-advisory-acceptance.md (source of truth
# for rationale, affected graphs, owner, revisit + removal conditions). Terse
# enforcement summary: compile-time-only transitive via age → i18n-embed-fl, not in
# any shipped runtime binary; no safe upgrade path; revisit by v0.2.1 or 2026-10-13.
# This is the ONLY permitted advisory ignore — a new advisory must not hide behind
# it, which is why CI runs `cargo audit --deny warnings --ignore RUSTSEC-2026-0173`
# (both locks) alongside `cargo deny check advisories`.
ignore = [
  { id = "RUSTSEC-2026-0173", reason = "accepted per SDR-0003: unmaintained compile-time-only transitive (age → i18n-embed-fl); no safe upgrade; revisit by v0.2.1 or 2026-10-13" },
]

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
