# cargo-deny configuration (bootstrap)
#
# Goal: keep a permissive license posture (MIT/Apache-2.0/BSD/ISC/etc) and
# fail fast if GPL-family deps appear.

[graph]
all-features = true

[advisories]
db-path = "target/advisory-dbs"
db-urls = ["https://github.com/RustSec/advisory-db"]
# Transitive via age → i18n-embed-fl; no maintained upgrade path until age moves off
# proc-macro-error2. Track upstream; drop ignore when the graph no longer pulls it.
ignore = [
  { id = "RUSTSEC-2026-0173", reason = "unmaintained transitive (age/i18n-embed-fl); no safe upgrade" },
]

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
