# cargo-deny configuration (bootstrap)
#
# Goal: keep a permissive license posture (MIT/Apache-2.0/BSD/ISC/etc) and
# fail fast if GPL-family deps appear.

[graph]
all-features = true

[advisories]
db-path = "target/advisory-dbs"
db-urls = ["https://github.com/RustSec/advisory-db"]
# RUSTSEC-2026-0173 (proc-macro-error2 unmaintained). Added 2026-07-16.
# Compile-time-only proc macro reached transitively via age → i18n-embed-fl; it is
# not linked into the shipped runtime binary (verified: `cargo tree -i
# proc-macro-error2` has i18n-embed-fl as its sole parent). Unmaintained flag, not a
# known vulnerability, with no safe upgrade path (age 0.12 still resolves it).
# Removal condition: drop this ignore as soon as the age → i18n-embed-fl stack stops
# resolving proc-macro-error2. Revisit by the v0.2.1 train or 2026-10-13, whichever
# comes first. This is the ONLY permitted advisory ignore — a new advisory must not
# hide behind it, which is why CI runs `cargo audit --deny warnings --ignore
# RUSTSEC-2026-0173` alongside `cargo deny check advisories`.
ignore = [
  { id = "RUSTSEC-2026-0173", reason = "unmaintained compile-time-only transitive (age → i18n-embed-fl); no safe upgrade; revisit by v0.2.1 or 2026-10-13" },
]

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
