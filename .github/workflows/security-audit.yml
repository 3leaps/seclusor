name: security-audit
# Scheduled advisory + audit sweep of the committed lockfiles (root + TS-native).
#
# The on-change ci.yml security step catches advisories introduced by a PR. This
# scheduled run catches advisories disclosed *against a static pin* — a CVE filed
# against a lockfile that has not moved would otherwise never be re-evaluated
# between dependency PRs. It reuses the same `make ci-security` gate, so both
# committed crypto graphs (root Cargo.lock and bindings/typescript/native/Cargo.lock)
# are re-scanned against the current advisory DB every day.
on:
  schedule:
    # 07:17 UTC daily (off the top of the hour to avoid scheduler contention).
    - cron: "17 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  audit:
    name: Advisory + audit sweep (scheduled)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fulmenhq/goneat-tools-runner-glibc:v0.5.1
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.94.0
      - name: Cache cargo-audit binary
        uses: actions/cache@v4
        with:
          path: /opt/cargo/bin/cargo-audit
          # Bump the image tag in this key whenever the runner image changes, so a
          # cargo-audit compiled against a different glibc is never restored.
          # Keep in lockstep with the same key in ci.yml.
          key: cargo-audit-0.22.2-goneat-tools-runner-glibc-v0.5.1
      - name: Advisory + audit gates (root + TS-native locks)
        shell: bash
        run: |
          set -euo pipefail
          # The runner carries cargo-audit, but its version is independent of this
          # repository's reviewed pin. Install the exact version on a cache miss or
          # whenever the image-provided binary differs. Mirrors ci.yml.
          if [ "$(cargo-audit --version 2>/dev/null || true)" != "cargo-audit 0.22.2" ]; then
            cargo install cargo-audit --version 0.22.2 --locked --force
          fi
          cargo-audit --version
          make ci-security
