name: ci
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to generate the SBOM from
        required: true
        type: string
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
jobs:
  rust-quality:
    if: github.event_name != 'workflow_dispatch'
    name: Rust Quality (Linux)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fulmenhq/goneat-tools-runner-glibc:v0.5.1
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.94.0
      - name: Bootstrap pinned non-cargo tools
        shell: bash
        run: |
          set -euo pipefail
          FORCE=1 make bootstrap-release-tools
          make bootstrap-format-tools
      - name: Verify runner tools
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          go version
          node --version
          npm --version
          bin/goneat version
          bin/sfetch --version
          bin/yamlfmt -version
          bin/node/bin/prettier --version
          bin/node/bin/biome --version
          ruff --version
          cargo-deny --version
      - name: CI checks
        shell: bash
        run: |
          set -euo pipefail
          make ci
      - name: Cache cargo-audit binary
        uses: actions/cache@v4
        with:
          path: /opt/cargo/bin/cargo-audit
          # Bump the image tag in this key whenever the runner image changes, so a
          # cargo-audit compiled against a different glibc is never restored.
          key: cargo-audit-0.22.2-goneat-tools-runner-glibc-v0.5.1
      - name: Security advisories (deny advisories + cargo-audit)
        shell: bash
        run: |
          set -euo pipefail
          # The runner carries cargo-audit, but its version is independent of this
          # repository's reviewed pin. Install the exact version on a cache miss or
          # whenever the image-provided binary differs.
          if [ "$(cargo-audit --version 2>/dev/null || true)" != "cargo-audit 0.22.2" ]; then
            cargo install cargo-audit --version 0.22.2 --locked --force
          fi
          cargo-audit --version
          make ci-security
      - name: Lockfile enforcement (static guard + negative controls)
        shell: bash
        run: |
          set -euo pipefail
          # Static guard: every artifact-producing cargo/zigbuild invocation (incl.
          # the cross-target release/go-bindings workflow paths) enforces --locked.
          make check-locked-builds
          # Prove the committed locks are load-bearing: a deliberately stale lock
          # must make each real build entrypoint fail (EPR-0001 conformance). Runs
          # here because it resolves the dependency graph (needs the registry index).
          make negative-control-locks
      - name: Go bindings tests
        shell: bash
        run: |
          set -euo pipefail
          make go-test
      - name: TypeScript bindings tests
        shell: bash
        run: |
          set -euo pipefail
          make ts-test
  # Native cargo clippy + test on every supported OS/arch. Custom runner labels
  # (ubuntu-latest-arm64-s, windows-latest-arm64-s) are declared in
  # .github/actionlint.yaml for the 3leaps org.
  #
  # Platform matrix (5):
  #   Linux x64 / arm64, macOS arm64, Windows x64 / arm64
  native-test:
    if: github.event_name != 'workflow_dispatch'
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
          - os: ubuntu-latest-arm64-s
            name: linux-arm64
          - os: macos-14
            name: darwin-arm64
          - os: windows-latest
            name: windows-amd64
          - os: windows-latest-arm64-s
            name: windows-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.94.0
      - name: Clippy and test (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
      - name: Clippy and test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # FFI crate excluded — platform-specific linking; Windows native path
          # still runs ReplaceFileW / CAS / DACL unit tests in seclusor CLI.
          cargo clippy --workspace --all-targets --all-features --exclude seclusor-ffi -- -D warnings
          cargo test --workspace --all-features --exclude seclusor-ffi
  windows-cross-check:
    if: github.event_name != 'workflow_dispatch'
    name: Cross-check (Windows)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.target }}
      - name: Type-check Windows target
        shell: bash
        run: |
          set -euo pipefail
          # cargo check (type-check only, no linking) catches Windows-specific
          # compile errors without requiring Windows SDK or linkers.
          # FFI crate excluded — uses platform-specific linking.
          cargo check --workspace --exclude seclusor-ffi --target ${{ matrix.target }}
  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.94.0
      - name: Install cargo-cyclonedx
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --version
      - name: Generate SBOM
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          cargo cyclonedx --all --format json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4.6.2
        with:
          name: sbom-cyclonedx
          path: "**/*.cdx.json"
          if-no-files-found: error
  dependency-parity:
    if: github.event_name != 'workflow_dispatch'
    name: Crypto-graph parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crypto-graph parity + negative controls
        shell: bash
        run: |
          set -euo pipefail
          # Reads the committed lockfiles only (no build, no network). Asserts the
          # security-critical crypto graph resolves to identical upstream source
          # identities across surfaces, and proves the check rejects a divergent,
          # absent, or undeclared graph.
          make parity-check
          make negative-control-parity
