name: ci
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
jobs:
  rust-quality:
    name: Rust Quality (Linux)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fulmenhq/goneat-tools-runner-glibc:v0.4.1
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.94.0
      - name: Bootstrap pinned non-cargo tools
        shell: bash
        run: |
          set -euo pipefail
          FORCE=1 make bootstrap-release-tools
          make bootstrap-format-tools
      - name: Verify runner tools
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          go version
          node --version
          npm --version
          bin/goneat version
          bin/sfetch --version
          bin/yamlfmt -version
          bin/node/bin/prettier --version
          bin/node/bin/biome --version
          cargo-deny --version
      - name: CI checks
        shell: bash
        run: |
          set -euo pipefail
          make ci
      - name: Security advisories (deny advisories + cargo-audit)
        shell: bash
        run: |
          set -euo pipefail
          # cargo-deny is pre-baked and runnable in the runner image. The pre-baked
          # cargo-audit is linked against a newer glibc than the image provides and
          # fails to load, so rebuild it in-container when it cannot actually run
          # (--force overrides the broken same-version binary on PATH).
          cargo-audit --version >/dev/null 2>&1 || cargo install cargo-audit --locked --force
          make ci-security
      - name: Go bindings tests
        shell: bash
        run: |
          set -euo pipefail
          make go-test
      - name: TypeScript bindings tests
        shell: bash
        run: |
          set -euo pipefail
          make ts-test
  # Native cargo clippy + test on every supported OS/arch. Custom runner labels
  # (ubuntu-latest-arm64-s, windows-latest-arm64-s) are declared in
  # .github/actionlint.yaml for the 3leaps org.
  #
  # Platform matrix (5):
  #   Linux x64 / arm64, macOS arm64, Windows x64 / arm64
  native-test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
          - os: ubuntu-latest-arm64-s
            name: linux-arm64
          - os: macos-14
            name: darwin-arm64
          - os: windows-latest
            name: windows-amd64
          - os: windows-latest-arm64-s
            name: windows-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.94.0
      - name: Clippy and test (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
      - name: Clippy and test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # FFI crate excluded — platform-specific linking; Windows native path
          # still runs ReplaceFileW / CAS / DACL unit tests in seclusor CLI.
          cargo clippy --workspace --all-targets --all-features --exclude seclusor-ffi -- -D warnings
          cargo test --workspace --all-features --exclude seclusor-ffi
  windows-cross-check:
    name: Cross-check (Windows)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.target }}
      - name: Type-check Windows target
        shell: bash
        run: |
          set -euo pipefail
          # cargo check (type-check only, no linking) catches Windows-specific
          # compile errors without requiring Windows SDK or linkers.
          # FFI crate excluded — uses platform-specific linking.
          cargo check --workspace --exclude seclusor-ffi --target ${{ matrix.target }}
  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.94.0
      - name: Install cargo-cyclonedx
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-cyclonedx --locked
      - name: Generate SBOM
        shell: bash
        run: |
          set -euo pipefail
          cargo cyclonedx --all --format json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4.6.2
        with:
          name: sbom-cyclonedx
          path: "**/bom.json"
