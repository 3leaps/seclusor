# Read-only release artifact workflow.
#
# On a `v*` tag push: restore both annotated signed tags (`vX.Y.Z` and
# `bindings/go/seclusor/vX.Y.Z`) using the read-only job token, verify both
# against the public pins and decernor anchors committed in the tagged commit,
# verify committed Go prebuilt libraries, build the 5 bare CLI binaries from the
# verified commit, and stage `release-packages-vX.Y.Z` as a workflow artifact.
#
# This workflow holds zero signing or write authority and never creates or edits
# a GitHub Release. A green run is a consistency signal; the maintainer
# independently verifies tags and digests locally before creating the draft.
name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  verify:
    name: Verify Signed Tags & Release Preconditions
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      object: ${{ steps.identity.outputs.object }}
      go_tag_object: ${{ steps.identity.outputs.go_tag_object }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned decernor
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d "$RUNNER_TEMP/decernor.XXXXXX")"
          SECLUSOR_DECERNOR_BIN="$(./scripts/ci-install-decernor.sh "$tool_dir")"
          case "$SECLUSOR_DECERNOR_BIN" in
            *$'\n'*) echo "error: decernor install printed extra stdout" >&2; exit 1 ;;
          esac
          echo "SECLUSOR_DECERNOR_BIN=$SECLUSOR_DECERNOR_BIN" >> "$GITHUB_ENV"
      - name: Restore annotated tags and verify against committed pins
        id: identity
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          SECLUSOR_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -x "${SECLUSOR_DECERNOR_BIN:?SECLUSOR_DECERNOR_BIN required}"
          ./scripts/release-restore-tag-ref.sh
          ./scripts/verify-pinned-tag.sh

          file_version="$(tr -d ' \t\r\n' < VERSION)"
          tag_version="${SECLUSOR_RELEASE_TAG#v}"
          if [ "$file_version" != "$tag_version" ]; then
            echo "error: VERSION ($file_version) != tag ($tag_version)" >&2
            exit 1
          fi

          object="$(git rev-parse "refs/tags/$SECLUSOR_RELEASE_TAG")"
          go_tag="bindings/go/seclusor/$SECLUSOR_RELEASE_TAG"
          go_object="$(git rev-parse "refs/tags/$go_tag")"
          commit="$(git rev-parse HEAD)"

          for pair in "$SECLUSOR_RELEASE_TAG:$object" "$go_tag:$go_object"; do
            t_name="${pair%:*}"
            t_obj="${pair#*:}"
            tag_json="$(gh api "repos/3leaps/seclusor/git/tags/$t_obj")"
            jq -e --arg tag "$t_name" --arg sha "$commit" \
              '.tag == $tag and .object.type == "commit" and .object.sha == $sha and
               .verification.verified == true and .verification.reason == "valid"' \
              <<<"$tag_json" >/dev/null
          done

          {
            echo "tag=$SECLUSOR_RELEASE_TAG"
            echo "version=$file_version"
            echo "object=$object"
            echo "go_tag_object=$go_object"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

          printf '{"tag":"%s","object":"%s","go_tag_object":"%s","commit":"%s"}\n' \
            "$SECLUSOR_RELEASE_TAG" "$object" "$go_object" "$commit" > release-identity.json
      - name: Verify Go module contains prebuilt libs
        shell: bash
        run: |
          set -euo pipefail
          test -f bindings/go/seclusor/go.mod
          test -f bindings/go/seclusor/include/seclusor.h

          for platform in \
            darwin-amd64 \
            darwin-arm64 \
            linux-amd64 \
            linux-arm64 \
            windows-amd64
          do
            path="bindings/go/seclusor/lib/${platform}/libseclusor_ffi.a"
            if [ ! -f "$path" ] || [ ! -s "$path" ]; then
              echo "ERROR: missing or empty $path" >&2
              exit 1
            fi
          done
          echo "Go binding assets verified."
      - name: Upload verified release identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-identity
          path: release-identity.json
          if-no-files-found: error
          retention-days: 30
  build-assets:
    name: Build (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    needs: verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bin_name: seclusor
            asset_name: seclusor-linux-amd64
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            bin_name: seclusor
            asset_name: seclusor-linux-arm64
          - os: macos-15
            target: aarch64-apple-darwin
            bin_name: seclusor
            asset_name: seclusor-darwin-arm64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            bin_name: seclusor.exe
            asset_name: seclusor-windows-amd64.exe
          - os: windows-latest-arm64-s
            target: aarch64-pc-windows-msvc
            bin_name: seclusor.exe
            asset_name: seclusor-windows-arm64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm annotated tag objects and commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECLUSOR_RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          SECLUSOR_EXPECTED_TAG_OBJECT: ${{ needs.verify.outputs.object }}
          SECLUSOR_EXPECTED_GO_TAG_OBJECT: ${{ needs.verify.outputs.go_tag_object }}
          EXPECTED_COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          ./scripts/release-restore-tag-ref.sh
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # v1
        with:
          toolchain: "1.94.0"
          targets: ${{ matrix.target }}
      - name: Verify target installed
        shell: bash
        run: rustup target add ${{ matrix.target }}
      - name: Install Linux cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build binary
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          set -euo pipefail
          # artifact-callsite: release-cli
          ./scripts/cargo-artifact-build.sh build --target "${{ matrix.target }}" -p seclusor
      - name: Stage release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/${{ matrix.asset_name }}"
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-${{ matrix.target }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error
          retention-days: 30
  package-release:
    name: Stage Unsigned Release Artifact Bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs: [verify, build-assets]
    permissions:
      contents: read
    steps:
      - name: Download release identity
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-identity
          path: dist/release
      - name: Download platform binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: build-*
          path: artifacts
      - name: Consolidate and verify bundle inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          for name in \
            seclusor-darwin-arm64 \
            seclusor-linux-amd64 \
            seclusor-linux-arm64 \
            seclusor-windows-amd64.exe \
            seclusor-windows-arm64.exe
          do
            found="$(find artifacts -type f -name "$name" | head -n 1)"
            if [ -z "$found" ] || [ ! -s "$found" ]; then
              echo "error: missing or empty build artifact: $name" >&2
              exit 1
            fi
            cp "$found" "dist/release/$name"
          done
          test -s dist/release/release-identity.json
          ls -la dist/release/
      - name: Upload consolidated release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-packages-${{ needs.verify.outputs.tag }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30
