[package]
name = "seclusor-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
signing = ["dep:ed25519-dalek", "dep:getrandom", "dep:zeroize"]

[dependencies]
age = { workspace = true, features = ["armor"] }
base64 = { workspace = true }
ed25519-dalek = { version = "3", optional = true, default-features = false, features = ["zeroize"] }
getrandom = { version = "0.4", optional = true }
seclusor-core = { workspace = true }
thiserror = { workspace = true }
zeroize = { version = "1", optional = true, features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
